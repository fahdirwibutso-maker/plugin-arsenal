<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>WellarShop — Fresh Groceries & Wholesale Supermarket</title>
    <meta name="description" content="WellarShop is your trusted online supermarket for fresh produce, beverages and pantry staples. Shop retail or unlock wholesale pricing across Rwanda." />
    <meta name="author" content="WellarShop" />
    <link rel="canonical" href="https://wellar.lovable.app/" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#16a34a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WellarShop" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-TileColor" content="#16a34a" />
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- PWA Icons -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:title" content="WellarShop — Fresh Groceries & Wholesale Supermarket" />
    <meta property="og:description" content="Shop fresh produce, beverages and pantry staples online. Retail and wholesale pricing across Rwanda." />
    <meta property="og:url" content="https://wellar.lovable.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WellarShop" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WellarShop — Fresh Groceries & Wholesale Supermarket" />
    <meta name="twitter:description" content="Shop fresh produce, beverages and pantry staples online. Retail and wholesale pricing across Rwanda." />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "name": "WellarShop",
          "url": "https://wellar.lovable.app/",
          "logo": "https://wellar.lovable.app/pwa-512x512.png"
        },
        {
          "@type": "WebSite",
          "name": "WellarShop",
          "url": "https://wellar.lovable.app/",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://wellar.lovable.app/shop?search={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "LocalBusiness",
          "@id": "https://wellar.lovable.app/#localbusiness",
          "name": "WellarShop",
          "image": "https://wellar.lovable.app/pwa-512x512.png",
          "url": "https://wellar.lovable.app/",
          "telephone": "+250 788 000 000",
          "priceRange": "FRw 500–50000",
          "currenciesAccepted": "RWF",
          "paymentAccepted": "Cash, Mobile Money, Credit Card",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "123 Market Street",
            "addressLocality": "Kigali",
            "addressRegion": "Kigali",
            "addressCountry": "RW"
          },
          "openingHoursSpecification": [
            {
              "@type": "OpeningHoursSpecification",
              "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
              "opens": "08:00",
              "closes": "20:00"
            }
          ]
        }
      ]
    }
    </script>

    <style>
      /* Prevent pull-to-refresh on mobile */
      html, body {
        overscroll-behavior-y: contain;
      }
      /* Safe area padding for notched devices */
      body {
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
